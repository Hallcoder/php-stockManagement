<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./inventory.css">
    <title>Inventory</title>
</head>
<body>
<div class=" container m-auto w-50 p-auto">
    <h1 class="header">Register Product</h1>
<form method="post" action="../handlers/InsertProducts.php" class="row g-1 m-auto">
    <div class="mb-3">
        <label for="product-name" class="form-label">Product Name</label>
        <input type="text" class="form-control w-50" id="product-name" placeholder="Enter product" name="product">
    </div>
    <div class="mb-3">
        <label for="brand" class="form-label">Brand</label>
        <input type="text" class="form-control w-50" id="brand" placeholder="Enter brand" name="brand">
    </div>
    <div class="mb-3">
        <label for="phone" class="form-label">Supplier Phone Number</label>
        <input type="number" class="form-control w-50" id="phone" placeholder="Enter phone number" name="phone">
    </div>
    <div class="mb-3">
        <label for="supplier" class="form-label">Supplier Name</label>
        <input type="text" class="form-control w-50" id="supplier" placeholder="Enter supplier" name="supplier">
    </div>
    <div class="mb-3">
        <label for="date" class="form-label">Added Date</label>
        <input type="date" class="form-control w-50" id="date" placeholder="Enter supplier" name="date">
    </div>
    <div class="col-auto mb-3">
        <button type="submit" class="btn btn-success mb-3" name="submit">Register</button>
    </div>
</form>
    </div>
</body>
</html>
