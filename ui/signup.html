<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300&family=Poppins:wght@200;400;500;900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./signup.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h1>Sign Up </h1>
        <form action="../handlers/signin.php">
            <div class="inputLabels">
                <label for="firstname">FirstName</label>
                <input type="text" name="firstname">
            </div>
            <div class="inputLabels">
                <label for="lastname">LastName</label>
                <input type="password" name="lastname">
            </div>
            <div class="inputLabels">
                <label for="username">Username</label>
                <input type="text" name="username">
            </div>
            <div class="inputLabels">
                <label for="email">Email</label>
                <input type="email" name="email">
            </div>
            <div class="inputLabels">
                <label for="gender">Gender</label>
                <input type="radio" name="gender" value="male">
                <label for="gender">Male</label>
                <input type="radio" name="gender" value="female">
                <label for="gender">female</label>
            </div>
            <div class="inputLabels">
                <label for="telephone">Tel</label>
                <input type="tel" name="telephone">
            </div>
            <div class="inputLabels">
                <label for="password">Password</label>
                <input type="password" name="password">
            </div>
            <div class="inputLabels">
                <label for="password">Nationality</label>
                <select name="gender" >
                    <option value="rwandan">Rwandan</option>
                    <option value="american">American</option>
                    <option value="southAfrican">South African</option>
                    <option value="ugandan">Ugandan</option>
                </select>
            </div>
            <div class="inputLabels">
                <input type="submit" value="Sign Up">
            </div>
            <div>
                <p>Already have an account?<a href="./login.html">Login</a></p>
            </div>
        </form>
    </div>
</body>
</html>
