<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>CRUD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200&display=swap" rel="stylesheet">
    <style>
        *{
            font-family: nunito;
        }
        .header {
            padding:10px;
            font-size:30px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="heading">
    </div>
    <div class="form  container m-auto w-50 p-auto">
        <h1 class="header"> Create account</h1>
        <form action="../handlers/insertUser.php" method="POST" enctype="multipart/form-data">
            <div class="row mb-3">
                <label for="fname"> First Name</label>
                <input type="text" name="firstname" class = "form-control" id="fname" placeholder="Enter First Name" required>
            </div>
            <div class="row mb-3">
                <label for="lname"> Last Name</label>
                <input type="text" name="lastname" class = "form-control" id="lname" placeholder="Enter Last Name" required>
            </div>
            <div class="row mb-3">
                <label for="email"> Email</label>
                <input type="email" name="email" class = "form-control" id="email" placeholder="Enter your email" required>
            </div>
            <div class="row mb-3">
                <label for="tel"> Telephone</label>
                <input type="number" name="telephone" class = "form-control" id="tel" placeholder="Enter Telephone NUmber" required>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="flexRadioDefault1" value="Male">
                <label class="form-check-label" for="flexRadioDefault1">
                    Male
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="flexRadioDefault2" value="Female">
                <label class="form-check-label" for="flexRadioDefault2">
                    Female
                </label>
            </div>
            <div class="row mb-3">
                <label for="nationality"> Nationality</label>
                <Select name="nationality" id="nationality" class = "form-control">

                    <option value=""> --Select--</option>
                    <option value="Rwandan"> Rwandan</option>
                    <option value="Ugandan">Ugandan</option>
                    <option value="Kenyan"> Kenyan</option>
                </Select>
            </div>
            <div class="row mb-3">
                <label for="username"> User Name</label>
                <input type="text" name="username" class = "form-control" id="username" placeholder="Enter your username" required>
            </div>

            <div class="row mb-3">
                <label for="password"> Password</label>
                <input type="password" name="password" class = "form-control" id="password" placeholder="Enter your Password" required>
            </div>
            <div class="row mb-3">
                <label for="cpassword"> Confirm Password</label>
                <input type="password" name="cpassword" class = "form-control" id="cpassword" placeholder="Confirm your Password" required>
            </div>
            <div class="submit mb-3">
                <input type="submit" class="btn btn-success" name="submit" value="Register">
            </div>
        </form>
    </div>
    <div class="footer"> Copyright @2021 RCA</div>
</div>



</body>
</html>
