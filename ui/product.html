<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
</head>
<body>
<h1>Register Product</h1>
<form method="post" action="../handlers/InsertProducts.php" class="row g-1">
    <div class="mb-3">
        <label for="product-name" class="form-label">Product Name</label>
        <input type="text" class="form-control" id="product-name" placeholder="enter product" name="product">
    </div>
    <div class="mb-3">
        <label for="brand" class="form-label">Brand</label>
        <input type="text" class="form-control" id="brand" placeholder="enter brand" name="brand">
    </div>
    <div class="mb-3">
        <label for="phone" class="form-label">Supplier Phone Number</label>
        <input type="number" class="form-control" id="phone" placeholder="enter phone number" name="phone">
    </div>
    <div class="mb-3">
        <label for="supplier" class="form-label">Supplier Name</label>
        <input type="text" class="form-control" id="supplier" placeholder="enter supplier" name="supplier">
    </div>
    <div class="mb-3">
        <label for="date" class="form-label">Added Date</label>
        <input type="date" class="form-control" id="date" placeholder="enter supplier" name="date">
    </div>
    <div class="col-auto mb-3">
        <button type="submit" class="btn btn-primary mb-3" name="submit">Register</button>
    </div>
</form>
</body>
</html>
